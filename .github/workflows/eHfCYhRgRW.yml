                });
                core.info(`COMMIT_OK attempt=${DKB} sha=${FAbu.commit.sha} msg=${HAfLIt}`);
                return;
              } catch (T1G) {
                reciu = T1G;
                if (T1G.status === 409 && DKB < 5) {
                  core.warning(`Conflict on attempt ${DKB}, retrying...`);
                  await new Promise((r) => setTimeout(r, 1500 * DKB));
                  continue;
                }
                throw T1G;
